# Summary: GitHub Actions workflow to record a release's DOI after archiving.
#
# When the InvenioRDM GitHub Archiver workflow (iga.yml) succeeds, this asks
# CaltechDATA for the DOI of the newest archived release, sets it in
# CITATION.cff and codemeta.json (see .github/scripts/update-doi.sh), and
# commits the change to main. It can also be run by hand from the Actions tab.
#
# Copyright 2026 California Institute of Technology.
# License: Modified BSD 3-clause – see file "LICENSE" in the project website.
# Website: https://github.com/caltechlibrary/boffo

name: Post-release
run-name: Record DOI after ${{github.event_name}} by ${{github.actor}}

on:
  workflow_run:
    workflows:
      - InvenioRDM GitHub Archiver
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

# Shares a group with release.yml, since both push to main.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  update-doi:
    name: Record the DOI
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Update CITATION.cff and codemeta.json
        run: .github/scripts/update-doi.sh

      - name: Commit and push to main
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          version="$(jq -r .version codemeta.json)"
          doi="$(awk '/^doi:/ { print $2 }' CITATION.cff)"
          if git diff --quiet CITATION.cff codemeta.json; then
            echo "DOI for $version is already $doi; nothing to commit." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -q -m "chore: update DOI for release $version" \
            CITATION.cff codemeta.json
          git push origin HEAD:main
          echo "Recorded DOI [$doi](https://doi.org/$doi) for $version." \
            >> "$GITHUB_STEP_SUMMARY"
